plugins {
    id 'com.android.application'
}

android {
    namespace '{{PACKAGE}}'
    compileSdk 34

    defaultConfig {
        applicationId '{{PACKAGE}}'
        minSdk 24
        targetSdk 34
        versionCode {{VERSION_CODE}}
        versionName '{{VERSION_NAME}}'
    }

    signingConfigs {
        release {
            storeFile file(project.property('ksPath'))
            storePassword project.property('ksPass')
            keyAlias 'appmint'
            keyPassword project.property('ksPass')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
